name: Native Continuous Integration

on:
  push:
    branches: [ main, "feature/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend and Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend and Contract Tests
        run: |
          pytest backend/tests/ -v

      - name: Verify Zero Emojis Across Repository
        run: |
          python -c "
          import os, sys
          emoji_pattern = False
          # Simple check for unicode emoji ranges in codebase
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.venv' in root or '__pycache__' in root:
                  continue
              for f in files:
                  if f.endswith(('.py', '.dart', '.md', '.json', '.yaml', '.yml')):
                      p = os.path.join(root, f)
                      with open(p, 'rb') as fh:
                          content = fh.read()
                          # Common emoji high surrogate / utf-8 check
                          for b in content:
                              if 0x1F300 <= b <= 0x1F9FF or 0x2600 <= b <= 0x26FF:
                                  print(f'Emoji detected in {p}')
                                  sys.exit(1)
          print('Zero emoji check passed successfully.')
          "
