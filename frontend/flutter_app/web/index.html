<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fidel — Autonomous Agentic AI Financial Management System">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FIDEL">

  <title>FIDEL — Autonomous Agentic AI Financial Management</title>
  <link rel="manifest" href="manifest.json">
  <script src="flutter.js" defer></script>
</head>
<body style="background-color: #000000; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh;">
  <div id="loading" style="display: flex; flex-direction: column; height: 100vh; width: 100vw; justify-content: center; align-items: center; background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div style="font-size: 18px; font-weight: 800; letter-spacing: 4px; margin-bottom: 12px;">FIDEL</div>
    <div style="font-size: 10px; color: #9A9A9A; letter-spacing: 2px;">INITIALIZING AUTONOMOUS ENGINE...</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      if (window._flutter && window._flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: {{flutter_service_worker_version}},
          },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine({
              useColorEmoji: false
            }).then(function(appRunner) {
              var loader = document.getElementById('loading');
              if (loader) loader.remove();
              appRunner.runApp();
            });
          }
        });
      }
    });
  </script>
</body>
</html>
